<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>AI Software & Game - Harta Karun</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        #gameContainer {
            position: relative;
            display: none;
            width: 1200px;
            height: 800px;
            margin: 0 auto;
        }

        canvas {
            background: #1e293b;
            border: 2px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            display: block;
        }

        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #gameOverScreen h1 {
            color: #ef4444;
            font-size: 60px;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 10px red;
        }

        #gameOverScreen h2 {
            color: white;
            font-size: 30px;
            margin: 0 0 30px 0;
        }

        #loginPanel {
            margin-top: 100px;
        }

        input,
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            margin: 5px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            background: #38bdf8;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #0ea5e9;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }
    </style>
</head>

<body>
    <h1>🗺️ Petualangan Harta Karun PPLG</h1>

    <div id="loginPanel">
        <h2>Pilih Karaktermu!</h2>
        <input type="text" id="playerName" placeholder="Nama Kamu..." required><br>
        <select id="playerRole">
            <option value="ksatria">Ksatria 🤺</option>
            <option value="penyihir">Penyihir 🧙‍♂️</option>
            <option value="pemanah">Pemanah 🏹</option>
            <option value="ninja">Ninja 🥷</option>
            <option value="cyborg">Cyborg 🤖</option>
        </select><br><br>
        <button onclick="joinGame()">Mulai Petualangan!</button>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="1200" height="800"></canvas>
        <div id="gameOverScreen">
            <h1>GAME OVER! 💀</h1>
            <h2 id="finalScore">Skor Akhir: 0 💎</h2>
            <button class="btn-danger" onclick="location.reload()">Main Lagi</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let keys = { up: false, down: false, left: false, right: false };
        let myId = null;

        let myLastScore = 0;
        let isDead = false;
        let audioCtx;
        let bgmInterval;
        let particles = [];

        function joinGame() {
            const nama = document.getElementById('playerName').value;
            const role = document.getElementById('playerRole').value;
            if (!nama) return alert('Isi nama dulu!');

            // Inisialisasi Audio dan mulai musik latar
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startBGM();

            myId = socket.id;
            socket.emit('joinGame', { nama, role });

            document.getElementById('loginPanel').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'block';
        }

        // --- SISTEM MUSIK LATAR (BGM) 8-BIT ---
        function startBGM() {
            // Melodi misterius ala dungeon (A2, C3, E3, D3)
            const notes = [110.00, 130.81, 164.81, 146.83];
            let step = 0;

            bgmInterval = setInterval(() => {
                if (!audioCtx || isDead) return; // Berhenti jika mati

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle'; // Gelombang triangle memberi kesan retro bass
                osc.frequency.value = notes[step % notes.length];

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                // Volume diatur rendah (0.1) agar tidak menutupi efek suara klik/permata
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.2);

                step++;
            }, 300); // Kecepatan tempo ketukan (300ms)
        }

        // --- SISTEM EFEK SUARA ---
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'gem') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1500, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // --- SISTEM ANIMASI PARTIKEL ---
        function spawnParticles(x, y) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1.0,
                    color: `hsl(${Math.random() * 60 + 180}, 100%, 60%)`
                });
            }
        }

        document.addEventListener('keydown', (e) => setKey(e, true));
        document.addEventListener('keyup', (e) => setKey(e, false));

        function setKey(e, isPressed) {
            if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.up = isPressed;
            if (['ArrowDown', 's', 'S'].includes(e.key)) keys.down = isPressed;
            if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = isPressed;
            if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = isPressed;
            socket.emit('keyState', keys);
        }

        function getRoleEmoji(role) {
            if (role === 'ksatria') return '🤺';
            if (role === 'penyihir') return '🧙‍♂️';
            if (role === 'pemanah') return '🏹';
            if (role === 'ninja') return '🥷';
            if (role === 'cyborg') return '🤖';
            return '👤';
        }

        // Render Game
        socket.on('gameState', (state) => {
            if (document.getElementById('gameContainer').style.display === 'none') return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.textAlign = "center";

            ctx.font = '24px Arial';
            state.gems.forEach(g => ctx.fillText('💎', g.x, g.y));

            ctx.font = '40px Arial';
            state.dragons.forEach(dragon => {
                ctx.fillText('🐉', dragon.x, dragon.y);
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;

                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                if (p.life <= 0) particles.splice(i, 1);
            }

            let me = state.players[myId];

            for (let id in state.players) {
                let p = state.players[id];
                ctx.font = '30px Arial';

                let icon = p.isGameOver ? '💀' : getRoleEmoji(p.role);
                ctx.fillText(icon, p.x, p.y);

                ctx.font = '14px Arial';
                ctx.fillStyle = p.isGameOver ? '#64748b' : (id === myId ? '#38bdf8' : 'white');
                ctx.fillText(`${p.nama} (${p.score})`, p.x, p.y - 30);
            }

            if (me) {
                if (me.score > myLastScore) {
                    playSound('gem');
                    spawnParticles(me.x, me.y - 15);
                    myLastScore = me.score;
                }

                if (me.isGameOver && !isDead) {
                    playSound('die');
                    isDead = true;
                    clearInterval(bgmInterval); // Matikan musik latar saat Game Over

                    document.getElementById('gameOverScreen').style.display = 'flex';
                    document.getElementById('finalScore').innerText = `Skor Akhir: ${me.score} 💎`;
                }
            }
        });
    </script>
</body>

</html>
